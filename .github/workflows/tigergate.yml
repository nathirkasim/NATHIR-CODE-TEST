name: TigerGate Security Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  security:
    runs-on: ubuntu-latest

    container:
      image: tigergate/tigergate-cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug TigerGate
        run: |
          echo "===== TigerGate ====="
          command -v tigergate
          tigergate --version
          tigergate --help
          tigergate scan --help

      - name: TigerGate Security Scan
        run: |
          tigergate scan \
            --api-url "https://api.staging.tigergate.dev/api/ci" \
            --scan-scope diff
        env:
          TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
