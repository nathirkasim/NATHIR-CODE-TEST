name: TigerGate Security Scan

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  security-scan:
    runs-on: ubuntu-latest

    container:
      image: tigergate/tigergate-cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TigerGate Security Scan
        run: |
          tigergate scan \
            --api-url "https://api.staging.tigergate.dev/api/ci" \
            --scan-scope diff \
            --type all
        env:
          TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
