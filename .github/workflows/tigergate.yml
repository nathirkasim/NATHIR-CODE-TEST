name: TigerGate Security Scan

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  security:
    runs-on: ubuntu-latest
    container:
      image: tigergate/tigergate-cli:latest

    strategy:
      fail-fast: false
      matrix:
        component:
          # Replace these with paths that exist in your repository
          - key: web
            path: apps/web
          - key: api
            path: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TigerGate Security Scan
        run: |
          tigergate scan \
            --api-url "https://api.staging.tigergate.dev/api/ci" \
            --scan-scope diff \
            --component "${{ matrix.component.key }}" \
            --component-path "${{ matrix.component.path }}"
        env:
          TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
