name: build-scan-deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: TigerGate scan and track
        run: |
          docker run --rm \
            -e TIGERGATE_API_KEY \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_REPOSITORY \
            -v "$PWD:/workspace" \
            -w /workspace \
            tigergate/tigergate-cli:latest \
            scan --type all --upload \
              --image ghcr.io/${{ github.repository }}:${{ github.sha }} \
              --image-digest "${{ steps.build.outputs.digest }}" \
              --deploy-target prod-eks/payments \
              --environment production

        env:
          TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}

      - name: Show image digest
        run: |
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
