jobs:
  security:
    runs-on: ubuntu-latest
    container: { image: tigergate/tigergate-cli:latest }
    strategy:
      fail-fast: false                    # one component failing must not cancel the rest
      matrix:
        component:
          - { key: web, path: apps/web }
          - { key: api, path: services/api }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # full history -> base-branch diff
      - run: >
          scan --api-url https://api.staging.tigergate.dev/api/ci --scan-scope diff
          --component ${{ matrix.component.key }}
          --component-path ${{ matrix.component.path }}
        env:
          TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
